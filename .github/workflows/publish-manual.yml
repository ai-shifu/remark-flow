name: Publish (manual)

# Manually-triggered npm publish. Lets collaborators publish remark-flow
# from any branch with an explicit version number, without a local `npm publish`
# (which requires interactive 2FA/OTP). npm authenticates via OIDC Trusted
# Publishing — no token secret needed.
#
# How to run:
#   Actions -> Publish (manual) -> Run workflow
#     - "Use workflow from": pick the branch to publish from (NOT main)
#     - version:      base version, e.g. 1.2.0 (no -dev suffix)
#     - release_type: dev (-> 1.2.0-dev.N on the `dev` dist-tag) or
#                     release (-> 1.2.0 on `latest`)
#
# Refuses to run on the default branch (main) or on tag refs.
#
# Step order note: the version-bump commit is pushed BEFORE `npm publish`.
# Publishing is irreversible; if the push happened after it and failed, the
# branch would permanently disagree with npm. With push-first, a failed
# publish just means re-running the workflow (the commit step is idempotent).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version, e.g. 1.2.0 (no -dev suffix)'
        required: true
        type: string
      release_type:
        description: 'Package type'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow pushing the version-bump commit back to the branch
      id-token: write # OIDC: authenticate to npm via Trusted Publishing

    steps:
      # Never publish from the protected default branch, and only from
      # branches — workflow_dispatch can also target tag refs.
      - name: Guard against publishing from main or a tag
        if: github.ref_type != 'branch' || github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Publish only from a non-default branch (got ${{ github.ref_type }} '${{ github.ref_name }}'). Run this workflow from a feature branch, then open a PR to merge the version bump back into main."
          exit 1

      # persist-credentials is off so the token is not written to .git/config,
      # where npm lifecycle scripts and build tooling could read it. The
      # version-bump push authenticates explicitly in its own step instead.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 20 ships an older
      # npm. Pinned version + --ignore-scripts: no unpinned resolution and no
      # lifecycle scripts during install.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@12.0.1 --ignore-scripts

      # --ignore-scripts: dependency lifecycle scripts must not run in CI.
      # Verified locally: tests and build pass without them (husky's prepare
      # hook is the only script and is not needed here).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests and validation
        run: |
          npm run lint
          npm run format:check
          npm run lint:md
          npm run test:coverage

      - name: Validate version and compute final version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          node <<'NODE'
          const cp = require("child_process");
          const fs = require("fs");

          const raw = (process.env.INPUT_VERSION || "").trim();
          const releaseType = (process.env.RELEASE_TYPE || "").trim();

          const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };

          // 1. Require a clean base version X.Y.Z (no suffix).
          if (!/^\d+\.\d+\.\d+$/.test(raw)) {
            fail(`Enter a clean base version like 1.2.0 (no -dev/-rc suffix), got '${raw}'.`);
          }

          const name = JSON.parse(fs.readFileSync("package.json", "utf8")).name;

          // 2. Fetch existing versions from npm. Fail closed: only a clean
          // E404 (package does not exist yet) may be treated as "no versions";
          // any other failure (network, auth, registry) must abort before the
          // stable-version check runs against incomplete data.
          let versions = [];
          try {
            const out = cp.execSync(`npm view ${name} versions --json`, {
              encoding: "utf8",
              stdio: ["ignore", "pipe", "pipe"],
            });
            const parsed = JSON.parse(out);
            versions = Array.isArray(parsed) ? parsed : [parsed];
          } catch (e) {
            const detail = `${e.stderr || ""}${e.stdout || ""}${e.message || ""}`;
            if (/E404|404 Not Found/.test(detail)) {
              versions = []; // package genuinely does not exist yet
            } else {
              fail(`npm view ${name} failed (not a 404) — refusing to continue with incomplete version data: ${detail.slice(0, 500)}`);
            }
          }
          const existing = new Set(versions);

          const cmp = (a, b) => {
            const pa = a.split(".").map(Number);
            const pb = b.split(".").map(Number);
            for (let i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
            return 0;
          };

          // 3. Must be greater than the latest stable (non-prerelease) version.
          const stable = versions.filter((v) => /^\d+\.\d+\.\d+$/.test(v));
          let latest = null;
          for (const v of stable) { if (latest === null || cmp(v, latest) > 0) latest = v; }
          if (latest && cmp(raw, latest) <= 0) {
            fail(`Version ${raw} must be greater than the latest published ${latest}.`);
          }

          // 4. Compute final version.
          let final;
          if (releaseType === "release") {
            final = raw;
            if (existing.has(final)) fail(`Version ${final} already exists on npm.`);
          } else {
            const re = new RegExp(`^${raw.replace(/\./g, "\\.")}-dev\\.(\\d+)$`);
            let maxN = 0, found = false;
            for (const v of versions) {
              const m = v.match(re);
              if (m) { found = true; maxN = Math.max(maxN, Number(m[1])); }
            }
            let n = found ? maxN + 1 : 1;
            final = `${raw}-dev.${n}`;
            while (existing.has(final)) { n += 1; final = `${raw}-dev.${n}`; }
          }

          const distTag = releaseType === "dev" ? "dev" : "latest";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `final_version=${final}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          console.log(`Resolved: ${name}@${final} (tag: ${distTag})`);
          NODE

      - name: Set package version
        env:
          FINAL_VERSION: ${{ steps.resolve.outputs.final_version }}
        run: npm version "$FINAL_VERSION" --no-git-tag-version --allow-same-version

      # Push the bump BEFORE the irreversible publish (see header note).
      # Idempotent: skips the commit when a retry finds no changes. The push
      # authenticates via an explicit tokened URL because checkout ran with
      # persist-credentials: false.
      - name: Commit and push version bump
        env:
          FINAL_VERSION: ${{ steps.resolve.outputs.final_version }}
          BRANCH_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json; then
            echo "Version files unchanged (retry of a pushed bump); skipping commit."
          else
            git add package.json package-lock.json
            git commit -m "chore: release ${FINAL_VERSION}"
          fi
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH_NAME}"

      - name: Build
        run: npm run build

      # No token: npm authenticates via OIDC Trusted Publishing (provenance is
      # attached automatically). Requires a trusted publisher configured on npm
      # for this repo + workflow file.
      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG"

      - name: Summary
        env:
          FINAL_VERSION: ${{ steps.resolve.outputs.final_version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## Published \`remark-flow@${FINAL_VERSION}\` (tag: ${DIST_TAG})"
            echo ""
            echo "- Branch: \`${BRANCH_NAME}\`"
            if [ "${RELEASE_TYPE}" = "dev" ]; then
              echo "- Install: \`npm install remark-flow@${FINAL_VERSION}\` (or \`remark-flow@dev\`)"
            else
              echo "- Install: \`npm install remark-flow@${FINAL_VERSION}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
