name: CI

# Lint, format-check, markdownlint, test and build on every PR and on main.
# Replaces the pre-commit.ci config (which was never installed for this repo);
# local hooks stay with husky + lint-staged.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts: dependency lifecycle scripts must not run in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Markdown lint
        run: npm run lint:md

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The built package through the Markdown pipeline a browser renders it with. The jest suite
      # cannot load remark (ESM-only), and hand-built trees never showed what Markdown does to an
      # interaction before the plugin runs.
      - name: Rendering pipeline tests
        run: node --test tests/pipeline/rendering-pipeline.test.mjs
